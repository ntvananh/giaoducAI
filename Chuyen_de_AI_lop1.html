iết kế trước.",tinhHuong:"Trò 'Lập trình viên tí hon': Cô là lập trình viên, HS là robot. Cô ra lệnh 'Nếu cô kể chuyện vui -> cười'. HS làm theo. Hỏi: Ai dặn robot cười?",hoatDong:"Vẽ dây điều khiển: Nối hình người lập trình -> robot cười. Sản phẩm: Tranh 'Con người lập trình cho AI'."},{code:"1.A1.4",mach:"A",req:"Nêu được một số ví dụ minh họa (như robot cười khi người dùng kể chuyện vui, hoặc trợ lí ảo nói 'Tôi rất vui được giúp bạn'), và giải thích được rằng những biểu hiện này chỉ là phản ứng được lập trình sẵn.",tinhHuong:"Kể 2 ví dụ: robot cười, trợ lý nói 'Tôi rất vui'. Phát thẻ tình huống cho 4 nhóm, nhóm thảo luận 60s: Đây là lập trình sẵn hay cảm xúc thật?",hoatDong:"Phiếu Đúng/Sai: Đánh dấu ✓ vào 'Lập trình sẵn'. Sản phẩm: Bảng ví dụ 2 cột của nhóm."},{code:"1.A2.1",mach:"A",req:"Nêu được các cách mà AI thể hiện cảm xúc qua hình ảnh, giọng nói hoặc hành vi (ví dụ: biểu tượng khuôn mặt vui, giọng nói thân thiện, hoặc lời chào dễ thương).",tinhHuong:"Cô cho xem 3 tranh: icon mặt cười, loa nói giọng ngọt ngào, robot vẫy tay. Hỏi: AI thể hiện cảm xúc bằng gì? HS chỉ vào mắt (hình ảnh) - tai (giọng nói) - tay (hành vi).",hoatDong:"Vẽ 3 cách AI thể hiện: Mắt - Miệng - Tay. Sản phẩm: Poster 3 ô 'AI thể hiện cảm xúc như thế nào?'."},{code:"1.A2.2",mach:"A",req:"Nhận biết và kể tên được một số sản phẩm hoặc thiết bị có sử dụng trí tuệ nhân tạo (ví dụ: loa thông minh, điện thoại có trợ lí ảo, robot hút bụi, xe tự lái, camera nhận diện khuôn mặt, ứng dụng dịch ngôn ngữ…).",tinhHuong:"Trò 'Săn tìm AI quanh em': Cô dán 6 tranh (loa thông minh, robot hút bụi, xe tự lái, camera, quạt thường, bút chì). HS chạy lên dán sticker 'Có AI' vào 5 tranh.",hoatDong:"Kể tên 1 đồ vật ở nhà có AI. Sản phẩm: Vòng tròn 'Nhà tớ có AI'."},{code:"1.A2.3",mach:"A",req:"Mô tả được công dụng chính của từng sản phẩm và cách AI giúp sản phẩm hoạt động thông minh hơn (ví dụ: loa thông minh hiểu lệnh bằng giọng nói; robot hút bụi tự tìm đường và tránh chướng ngại vật).",tinhHuong:"Cô đố: 'Loa thông minh thông minh ở đâu? Robot hút bụi thông minh ở đâu?' Dùng thẻ ghép: Tên sản phẩm -> Công dụng -> AI giúp gì.",hoatDong:"Ghép thẻ: Loa - Nghe giọng nói. Robot - Tự tránh bàn ghế. Sản phẩm: Bộ thẻ ghép đôi hoàn chỉnh."},{code:"1.B1.1",mach:"B",req:"Nêu được một số hành vi sử dụng AI có thể gây hại cho người khác.",tinhHuong:"Tình huống kể: Bạn Minh dùng AI tạo ảnh chế bạn khác để trêu chọc. Hỏi: Việc này có làm bạn buồn không? Thẻ Đỏ = Gây hại, Xanh = An toàn.",hoatDong:"Vẽ mặt buồn/bị tổn thương. Sản phẩm: Tấm biển 'Dừng lại - Không dùng AI trêu bạn'."},{code:"1.B3.1",mach:"B",req:"Nhận biết được rằng không được phép sử dụng AI với mục đích làm hại người khác.",tinhHuong:"Cô đưa luật lớp: 'Lớp 1 dùng AI để giúp đỡ'. Cả lớp đọc to quy tắc. Dán tranh 'Cấm': AI + hình làm hại = gạch chéo đỏ.",hoatDong:"Tô màu biển báo cấm. Ký tên vào cam kết 'Tớ hứa dùng AI việc tốt'. Sản phẩm: Bản cam kết cá nhân."},{code:"1.B3.2",mach:"B",req:"Nêu được ví dụ về việc con người sử dụng AI đúng cách, vì mục đích tốt đẹp.",tinhHuong:"3 tranh tốt: Dùng AI dịch tiếng cho bà, AI nhắc uống thuốc, AI tìm đường cứu hộ. Mỗi nhóm chọn 1 tranh kể 'AI giúp việc tốt gì?'",hoatDong:"Vẽ 1 việc tốt em muốn AI giúp (trồng cây, dọn rác). Sản phẩm: Tranh 'AI giúp việc tốt'."},{code:"1.C1.1",mach:"C",req:"Nhận biết được AI trong một số ví dụ cụ thể và đơn giản về AI.",tinhHuong:"Trò 'AI hay Không AI?': Cô giơ tranh: Google dịch, xe tự tránh vật cản, bút chì, thước kẻ. HS giơ bảng 'Có AI' / 'Không AI' trong 3 giây.",hoatDong:"Phân loại tranh vào 2 hộp. Sản phẩm: Hộp 'Có AI' với 3 ví dụ."},{code:"1.C1.2",mach:"C",req:"Nhận diện được một số công cụ AI quen thuộc và phổ biến trên điện thoại hoặc máy tính bảng (ví dụ: trợ lí ảo, nhận diện khuôn mặt, …).",tinhHuong:"Cô mô tả: 'Mở khóa điện thoại bằng mặt'. HS đoán tên công cụ. Dùng hình điện thoại giấy, dán sticker 'Nhận diện khuôn mặt' vào vị trí camera.",hoatDong:"Chỉ vào điện thoại giấy: Đây là trợ lý ảo, đây là camera AI. Sản phẩm: Mô hình điện thoại có nhãn AI."},{code:"1.C1.3",mach:"C",req:"Nhận biết được các thiết bị thông minh có các bộ phận giống với bộ phận của con người (ví dụ: camera là 'mắt' và micro là 'tai' của các thiết bị đó).",tinhHuong:"So sánh cơ thể: Cô dán hình người - camera là mắt, micro là tai, loa là miệng. HS nối dây: Mắt người -> Mắt camera.",hoatDong:"Vẽ robot có mắt (camera) tai (micro). Sản phẩm: Tranh 'Robot cũng có mắt tai như người'."},{code:"1.C1.4",mach:"C",req:"Nhận biết được AI có khả năng hiểu các mệnh lệnh đơn giản của con người, trò chuyện theo kịch bản định sẵn.",tinhHuong:"Trò 'Ra lệnh cho robot lớp 1': Cô làm robot chỉ hiểu 3 lệnh: 'Đứng lên', 'Vỗ tay', 'Ngồi xuống'. HS ra lệnh khác robot đứng im -> Hiểu: AI chỉ hiểu lệnh đơn giản đã học.",hoatDong:"Viết 2 lệnh đơn giản AI hiểu được. Sản phẩm: Thẻ lệnh 'AI hiểu'."},{code:"1.D1.1",mach:"D",req:"Nêu được ví dụ về một tình huống mà AI 'học' từ hình ảnh hoặc thông tin do con người cung cấp (ví dụ: AI học nhận biết con mèo, quả táo…).",tinhHuong:"Cô cho xem 5 ảnh mèo khác nhau: 'Cô dạy AI đây là mèo'. Hỏi: Nếu đưa ảnh mèo mới, AI biết không? Dùng hộp thẻ ảnh: Người cho ảnh -> AI học -> AI nhận ra.",hoatDong:"HS làm 'thầy cô của AI': Dán 3 ảnh táo vào bảng 'Dạy AI'. Sản phẩm: Bảng 'Tớ dạy AI nhận biết'."},{code:"1.D2.1",mach:"D",req:"Nhận biết được rằng có loại máy thông minh chỉ làm được một việc (như nhận biết hình ảnh), có loại có thể làm nhiều việc khác nhau (như lắng nghe - trả lời, thực hiện theo lệnh…).",tinhHuong:"So sánh: Máy quét mã vạch (1 việc) vs Loa thông minh (nhiều việc: nghe, trả lời, bật nhạc). Đưa 2 rổ: 1 việc / Nhiều việc, HS bỏ tranh vào đúng rổ.",hoatDong:"Phân loại 4 tranh vào bảng 2 cột. Sản phẩm: Bảng phân loại 1 việc - nhiều việc."},{code:"1.D2.2",mach:"D",req:"Xếp được một số máy thông minh vào hai nhóm: nhóm chỉ làm được một việc và nhóm làm được nhiều việc khác nhau.",tinhHuong:"Thi nhóm 4 người: 6 thẻ máy (camera đếm xe, robot hút bụi, loa thông minh, máy dịch). Trong 2 phút xếp vào 2 cột trên bản
